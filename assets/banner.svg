<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="45%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#031f38" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#091a2e" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- CSS Animation Styles -->
    <style>
      @keyframes flowWave {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes reverseFlow {
        0% { stroke-dashoffset: -2000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.4); opacity: 0.9; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes energySignal {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(1100px); opacity: 0; }
      }

      .animated-wave1 {
        stroke-dasharray: 200, 20;
        animation: flowWave 25s linear infinite;
      }
      .animated-wave2 {
        stroke-dasharray: 160, 40;
        animation: reverseFlow 20s linear infinite;
      }
      .node-pulse-1 {
        animation: pulseNode 3s ease-in-out infinite;
        transform-origin: 220px 80px;
      }
      .node-pulse-2 {
        animation: pulseNode 4s ease-in-out infinite 1s;
        transform-origin: 980px 110px;
      }
      .node-pulse-3 {
        animation: pulseNode 3.5s ease-in-out infinite 2s;
        transform-origin: 150px 320px;
      }
      .node-pulse-4 {
        animation: pulseNode 4.5s ease-in-out infinite 0.5s;
        transform-origin: 1060px 310px;
      }
      .floating-badge {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-badge-delayed {
        animation: floatSlow 5s ease-in-out infinite 2.5s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#gridPattern)" />

  <!-- Background Light Rays / Ambient Glow -->
  <circle cx="600" cy="180" r="320" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="100" r="180" fill="#22c55e" opacity="0.08" filter="url(#glow)" />
  <circle cx="1020" cy="300" r="220" fill="#6366f1" opacity="0.1" filter="url(#glow)" />

  <!-- Dynamic / Animated Waves (Background Layer) -->
  <g opacity="0.75">
    <!-- Grid Wave 1 -->
    <path class="animated-wave1" d="M -50 290 Q 200 210, 450 280 T 900 240 T 1250 270" fill="none" stroke="url(#waveGrad1)" stroke-width="2.5" filter="url(#softGlow)" />
    <!-- Grid Wave 2 -->
    <path class="animated-wave2" d="M -50 320 C 180 260, 360 360, 620 310 C 880 260, 1020 340, 1250 290" fill="none" stroke="url(#waveGrad2)" stroke-width="2" filter="url(#softGlow)" />
    <!-- Frequency Carrier Wave -->
    <path class="animated-wave1" d="M -50 110 Q 300 160, 600 90 T 1250 120" fill="none" stroke="url(#waveGrad1)" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Animated Power Nodes in Background -->
  <g>
    <!-- Node 1 -->
    <line x1="220" y1="80" x2="320" y2="130" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4" />
    <circle class="node-pulse-1" cx="220" cy="80" r="12" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="220" cy="80" r="4" fill="#ffffff" />

    <!-- Node 2 -->
    <line x1="980" y1="110" x2="880" y2="150" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,4" />
    <circle class="node-pulse-2" cx="980" cy="110" r="14" fill="#4ade80" filter="url(#glow)" />
    <circle cx="980" cy="110" r="5" fill="#ffffff" />

    <!-- Node 3 -->
    <circle class="node-pulse-3" cx="150" cy="320" r="10" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="150" cy="320" r="3.5" fill="#ffffff" />

    <!-- Node 4 -->
    <circle class="node-pulse-4" cx="1060" cy="310" r="12" fill="#a78bfa" filter="url(#glow)" />
    <circle cx="1060" cy="310" r="4" fill="#ffffff" />
  </g>

  <!-- FOREGROUND LAYER: Content, Title, Subtitle, and Feature Tags (Never Obscured) -->
  <g id="foreground-content">
    <!-- Top Super-header / Category Badge -->
    <g transform="translate(420, 42)">
      <rect x="0" y="0" width="360" height="32" rx="16" fill="#0c233c" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="20" cy="16" r="5" fill="#4ade80" filter="url(#softGlow)" />
      <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.5">SMART GRID &amp; DERMS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Smart Grid Demand Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
      Virtual Power Plants (VPP) • Demand Response (DR) • DER Orchestration &amp; Flexibility
    </text>

    <!-- Descriptive Tagline -->
    <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      A curated collection of production SaaS leaders, enterprise DERMS, and open-source flexibility engines
    </text>

    <!-- Bottom Feature Pills / Badges (in Foreground) -->
    <g transform="translate(110, 248)" class="floating-badge">
      <!-- Pill 1: VPP -->
      <g transform="translate(0, 0)">
        <rect width="180" height="52" rx="12" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="24" y="32" font-size="18">⚡</text>
        <text x="52" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Virtual Power Plants</text>
        <text x="52" y="42" font-family="sans-serif" font-size="11" font-weight="400" fill="#38bdf8">Dispatch &amp; Bidding</text>
      </g>

      <!-- Pill 2: Demand Response -->
      <g transform="translate(200, 0)">
        <rect width="180" height="52" rx="12" fill="url(#pillGrad)" stroke="#4ade80" stroke-width="1.2" />
        <text x="24" y="32" font-size="18">📉</text>
        <text x="52" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Demand Response</text>
        <text x="52" y="42" font-family="sans-serif" font-size="11" font-weight="400" fill="#4ade80">Peak Shaving &amp; OpenADR</text>
      </g>

      <!-- Pill 3: DERMS -->
      <g transform="translate(400, 0)">
        <rect width="180" height="52" rx="12" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" />
        <text x="24" y="32" font-size="18">🔋</text>
        <text x="52" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">DERMS &amp; Storage</text>
        <text x="52" y="42" font-family="sans-serif" font-size="11" font-weight="400" fill="#818cf8">Batteries &amp; EV Fleets</text>
      </g>

      <!-- Pill 4: Grid Flexibility -->
      <g transform="translate(600, 0)">
        <rect width="180" height="52" rx="12" fill="url(#pillGrad)" stroke="#06b6d4" stroke-width="1.2" />
        <text x="24" y="32" font-size="18">🌐</text>
        <text x="52" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Local Flexibility</text>
        <text x="52" y="42" font-family="sans-serif" font-size="11" font-weight="400" fill="#06b6d4">Marketplaces &amp; DSOs</text>
      </g>

      <!-- Pill 5: Open-Source Stacks -->
      <g transform="translate(800, 0)">
        <rect width="180" height="52" rx="12" fill="url(#pillGrad)" stroke="#f472b6" stroke-width="1.2" />
        <text x="24" y="32" font-size="18">💻</text>
        <text x="52" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Open Source Stacks</text>
        <text x="52" y="42" font-family="sans-serif" font-size="11" font-weight="400" fill="#f472b6">Self-Hosted &amp; Auditable</text>
      </g>
    </g>

    <!-- Sub-bar statistics -->
    <g transform="translate(340, 335)">
      <text x="0" y="20" font-family="sans-serif" font-size="12" font-weight="500" fill="#64748b">
        <tspan fill="#38bdf8" font-weight="700">10+</tspan> Enterprise SaaS Leaders  •  
        <tspan fill="#4ade80" font-weight="700">18+</tspan> Open-Source Engines  •  
        <tspan fill="#a78bfa" font-weight="700">OpenADR 2.0/3.0</tspan> Compliant
      </text>
    </g>
  </g>
</svg>
